<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adivina el Número - Vite</title>
  </head>
  <body>
    <div id="app" class="container">
      <h1>🎮 Adivina el Número</h1>
      <p>Estoy pensando en un número entre <strong>1 y 100</strong>. ¿Puedes adivinar cuál es?</p>
      
      <form id="guess-form">
        <input type="number" id="guess-input" min="1" max="100" placeholder="Tu número" required />
        <button type="submit">Adivinar</button>
      </form>

      <p id="message"></p>
      <p id="attempts">Intentos restantes: 10</p>
      <button id="restart-btn" style="display: none;">Reiniciar Juego</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
